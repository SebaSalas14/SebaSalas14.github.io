<!DOCTYPE html>
<!--
  Imagen de vista previa (Open Graph) para LinkedIn, WhatsApp, etc.
  Para regenerar assets/img/og-card.jpg tras cambiar el rol o los datos:
    chrome --headless=new --hide-scrollbars --window-size=1200,630 \
           --virtual-time-budget=5000 --screenshot=og-card.png tools/og-card.html
  y convertir el PNG a JPG (calidad ~90).
-->
<html lang="es">

<head>
    <meta charset="utf-8" />
    <title>OG card</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #070b14;
            --amber: #ffb547;
            --amber-2: #ff7a3d;
            --cyan: #3ee6ff;
            --green: #5af78e;
            --muted: #8592a8;
            --border: rgba(130, 160, 210, 0.18);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }

        body {
            position: relative;
            font-family: "JetBrains Mono", monospace;
            color: #f3f6fb;
            background:
                radial-gradient(circle at 18% 50%, rgba(255, 181, 71, 0.16), transparent 42%),
                radial-gradient(circle at 92% 8%, rgba(62, 230, 255, 0.14), transparent 40%),
                var(--bg);
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(130, 160, 210, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(130, 160, 210, 0.06) 1px, transparent 1px);
            background-size: 44px 44px;
        }

        canvas { position: absolute; inset: 0; }

        .card {
            position: relative;
            display: flex;
            align-items: center;
            gap: 64px;
            height: 100%;
            padding: 0 72px;
        }

        .ring {
            position: relative;
            flex: 0 0 300px;
            height: 300px;
            padding: 7px;
            border-radius: 50%;
            background: conic-gradient(var(--amber), var(--amber-2), transparent 40%, var(--cyan) 70%, var(--amber));
            box-shadow: 0 0 60px rgba(255, 181, 71, 0.35);
        }

        .ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 7px solid var(--bg);
        }

        .hello { color: var(--amber); font-size: 24px; }

        h1 {
            font-family: "Saira Extra Condensed", sans-serif;
            font-weight: 800;
            font-size: 132px;
            line-height: 0.9;
            text-transform: uppercase;
            margin: 8px 0 18px;
        }

        .grad {
            background: linear-gradient(100deg, var(--amber) 10%, var(--amber-2) 50%, var(--cyan) 110%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .role { color: var(--cyan); font-size: 30px; font-weight: 700; }
        .role b { color: var(--amber); }

        .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }

        .chips span {
            font-size: 19px;
            color: var(--cyan);
            padding: 6px 14px;
            border: 1px solid rgba(62, 230, 255, 0.3);
            border-radius: 999px;
            background: rgba(62, 230, 255, 0.06);
        }

        .foot {
            position: absolute;
            left: 72px;
            right: 72px;
            bottom: 34px;
            display: flex;
            justify-content: space-between;
            font-size: 19px;
            color: var(--muted);
        }

        .foot i {
            display: inline-block;
            width: 11px;
            height: 11px;
            margin-right: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
        }

        .url { color: var(--amber); }
    </style>
</head>

<body>
    <canvas id="net" width="1200" height="630"></canvas>
    <div class="card">
        <div class="ring"><img src="../assets/img/profile.jpg" alt="" /></div>
        <div>
            <p class="hello">// hola, soy</p>
            <h1>Sebastian <span class="grad">Salas</span></h1>
            <p class="role"><b>&gt;</b> Data Analyst / Data Engineer</p>
            <div class="chips">
                <span>Databricks</span><span>dbt</span><span>Power BI</span><span>SQL</span><span>Python</span>
            </div>
        </div>
    </div>
    <div class="foot">
        <span><i></i>Vibia · Barcelona · Ingeniero biomédico</span>
        <span class="url">sebasalas14.github.io</span>
    </div>

    <script>
        // Red de nodos como el fondo de la web, con semilla fija para que la imagen sea estable.
        var seed = 7;
        function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
        var ctx = document.getElementById("net").getContext("2d");
        var nodes = [];
        for (var i = 0; i < 70; i++) nodes.push({ x: rnd() * 1200, y: rnd() * 630, hot: rnd() < 0.22, r: 1.2 + rnd() * 1.8 });
        nodes.forEach(function (a, i) {
            nodes.slice(i + 1).forEach(function (b) {
                var d = Math.hypot(a.x - b.x, a.y - b.y);
                if (d < 150) {
                    ctx.strokeStyle = (a.hot || b.hot ? "rgba(255,181,71," : "rgba(62,230,255,") + (1 - d / 150) * 0.22 + ")";
                    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
                }
            });
        });
        nodes.forEach(function (a) {
            ctx.fillStyle = a.hot ? "rgba(255,181,71,.8)" : "rgba(62,230,255,.6)";
            ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
        });
    </script>
</body>

</html>
